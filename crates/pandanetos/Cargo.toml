[package]
name = "pandanetos"
version = "0.1.0"
edition = "2021"
description = "PandaNetOS - pandanetpl 生态统一标准库（错误、响应、协议、领域模型、工具）"
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
