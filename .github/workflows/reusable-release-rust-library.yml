name: Reusable Release - Rust Library

on:
  workflow_call:
    inputs:
      crate_name:
        description: "crate 名称"
        required: true
        type: string
      publish_to_crates:
        description: "是否发布到 crates.io"
        required: false
        type: boolean
        default: false
      create_github_release:
        description: "是否创建 GitHub Release"
        required: false
        type: boolean
        default: true
      run_tests:
        description: "发布前是否运行测试"
        required: false
        type: boolean
        default: true
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: "crates.io 发布令牌"
        required: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout PandaNetOS
        uses: actions/checkout@v4
        with:
          repository: PandaNetOS/PandaNetOS
          path: PandaNetOS

      - name: Move PandaNetOS
        shell: bash
        run: mv PandaNetOS ../PandaNetOS

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: cargo test --all

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  publish:
    needs: verify
    if: ${{ inputs.publish_to_crates }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout PandaNetOS
        uses: actions/checkout@v4
        with:
          repository: PandaNetOS/PandaNetOS
          path: PandaNetOS

      - name: Move PandaNetOS
        shell: bash
        run: mv PandaNetOS ../PandaNetOS

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --all

  release:
    needs: verify
    if: ${{ inputs.create_github_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.crate_name }} ${{ github.ref_name }}
          generate_release_notes: true
