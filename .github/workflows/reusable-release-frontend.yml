name: Reusable Release - Frontend

on:
  workflow_call:
    inputs:
      project_name:
        description: "项目名称"
        required: true
        type: string
      build_command:
        description: "构建命令"
        required: false
        type: string
        default: "npm run build"
      output_dir:
        description: "构建输出目录"
        required: false
        type: string
        default: "dist"
      deploy_to_pages:
        description: "是否部署到 GitHub Pages"
        required: false
        type: boolean
        default: false
      create_release:
        description: "是否创建 GitHub Release"
        required: false
        type: boolean
        default: true
      node_version:
        description: "Node.js 版本"
        required: false
        type: string
        default: "20"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ inputs.build_command }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_to_pages }}
        with:
          path: ${{ inputs.output_dir }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-build
          path: ${{ inputs.output_dir }}

  deploy-pages:
    needs: build
    if: ${{ inputs.deploy_to_pages }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.project_name }}-build
          path: ${{ inputs.project_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.project_name }} ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ inputs.project_name }}/**
