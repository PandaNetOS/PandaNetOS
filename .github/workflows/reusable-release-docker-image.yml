name: Reusable Release - Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        description: "镜像名称（如 pcdn-keeper）"
        required: true
        type: string
      dockerfile_path:
        description: "Dockerfile 路径"
        required: false
        type: string
        default: "Dockerfile"
      build_context:
        description: "构建上下文路径"
        required: false
        type: string
        default: "."
      platforms:
        description: "构建平台（逗号分隔）"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      push_to_dockerhub:
        description: "是否推送到 Docker Hub"
        required: false
        type: boolean
        default: false
      dockerhub_username:
        description: "Docker Hub 用户名"
        required: false
        type: string
        default: ""
      push_to_ghcr:
        description: "是否推送到 GHCR"
        required: false
        type: boolean
        default: true
      tag_latest:
        description: "是否同时打 latest 标签"
        required: false
        type: boolean
        default: true
      build_args:
        description: "构建参数（JSON 格式）"
        required: false
        type: string
        default: "{}"
    secrets:
      DOCKERHUB_TOKEN:
        description: "Docker Hub 访问令牌"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: ${{ inputs.push_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ inputs.push_to_dockerhub && format('{0}/{1}', inputs.dockerhub_username, inputs.image_name) || '' }}
            ${{ inputs.push_to_ghcr && format('ghcr.io/{0}/{1}', github.repository_owner, inputs.image_name) || '' }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            ${{ inputs.tag_latest && 'type=raw,value=latest,enable={{is_default_branch}}' || '' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ fromJson(inputs.build_args) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
